<VirtualHost *:80>
	ServerName wanderful.local
	Redirect permanent / https://wanderful.local/
</VirtualHost>

<VirtualHost *:443>
	ServerName wanderful.local
	DocumentRoot /var/www/wanderful.local
	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/wanderful.local.crt
	SSLCertificateKeyFile /etc/ssl/private/wanderful.local.key
	<Directory /var/www/wanderful.local>
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
